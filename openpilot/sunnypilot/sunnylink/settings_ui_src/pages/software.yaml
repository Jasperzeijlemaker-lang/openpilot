# Page: software
# Edit this file. Run compile_settings_ui.py to emit settings_ui.json.
id: software
label: Software
icon: software
order: 7
remote_configurable: true
description: Software update preferences
sections:
- id: updates
  title: Updates
  description: Control software updates
  items:
  - key: DisableUpdates
    widget: toggle
    title: Disable Updates
    description: When enabled, software updates will be off. This requires a reboot to take effect.
    enablement:
    - $ref: '#/macros/offroad'
    - $ref: '#/macros/advanced_only'
- id: remote_update
  title: Update From Here
  description: Update the device without going to the car
  items:
  - key: RemoteUpdateNow
    widget: toggle
    title: Update Now
    description: Downloads the newest version and restarts the device to install it. Only works with the car off and the device on Wi-Fi. Turns itself off when done.
    enablement:
    - $ref: '#/macros/offroad'
  - key: RemoteUpdateStatus
    widget: info
    title: Update Status
    blocked: true
